<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axey</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

body {
  height: 100vh;
  background: url('background.jpg') no-repeat center center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(15px);
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  transition: 0.8s ease;
}

.overlay h1 {
  font-size: 48px;
  margin-bottom: 20px;
  letter-spacing: 3px;
}

.continue-btn {
  padding: 12px 30px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  background: white;
  color: black;
  font-weight: 600;
  transition: 0.3s;
}

.continue-btn:hover {
  transform: scale(1.05);
}

.main-content {
  display: none;
  text-align: center;
  animation: fadeIn 1s ease forwards;
}

.pfp {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 3px solid white;
  margin-bottom: 20px;
  object-fit: cover;
  pointer-events: none;
}

.buttons a {
  display: block;
  margin: 10px auto;
  padding: 12px;
  width: 200px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  color: white;
  transition: 0.3s;
}

.instagram {
  background: linear-gradient(45deg, #f09433, #dc2743, #cc2366);
}

.discord {
  background: #5865F2;
}

.buttons a:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body oncontextmenu="return false">

<!-- Intro Screen -->
<div class="overlay" id="intro">
  <h1>Axey</h1>
  <button class="continue-btn" id="continueBtn">Continue</button>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
  <img src="pfp.jpg" class="pfp">
  <div class="buttons">
    <a href="https://instagram.com/yourusername" target="_blank" class="instagram">
      Instagram
    </a>
    <a href="https://discord.gg/yourinvite" target="_blank" class="discord">
      Discord
    </a>
  </div>
</div>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const intro = document.getElementById("intro");
const mainContent = document.getElementById("mainContent");
const music = document.getElementById("bgMusic");
const continueBtn = document.getElementById("continueBtn");

continueBtn.addEventListener("click", () => {
  music.play();
  intro.style.opacity = "0";
  setTimeout(() => {
    intro.style.display = "none";
    mainContent.style.display = "block";
  }, 800);
});

/* Extra protection */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
</script>

</body>
</html>
