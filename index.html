<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;

  /* Disable selection */
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;

  /* Disable long press highlight */
  -webkit-touch-callout: none;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  background: black;
}

/* Remove tap highlight */
a, button, img {
  -webkit-tap-highlight-color: transparent;
}

/* Background */
.background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('background.jpg') no-repeat center center/cover;
  filter: blur(8px) brightness(0.6);
  z-index: -1;
}

/* Card */
.card {
  text-align: center;
  backdrop-filter: blur(15px);
  background: rgba(0, 0, 0, 0.4);
  padding: 40px;
  border-radius: 20px;
  width: 320px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

.pfp {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid white;
  margin-bottom: 20px;
  object-fit: cover;
  pointer-events: none; /* Prevent image drag */
}

h1 {
  font-size: 22px;
  margin-bottom: 20px;
}

.buttons a {
  display: block;
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s ease;
}

.instagram {
  background: linear-gradient(45deg, #f09433, #dc2743, #cc2366);
  color: white;
}

.discord {
  background: #5865F2;
  color: white;
}

.buttons a:hover {
  transform: scale(1.05);
  opacity: 0.9;
}
</style>
</head>

<body oncontextmenu="return false">

<div class="background"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <img src="pfp.jpg" class="pfp">
  <h1>Your Username</h1>

  <div class="buttons">
    <a href="https://instagram.com/yourusername" target="_blank" class="instagram">
      Instagram
    </a>

    <a href="https://discord.gg/yourinvite" target="_blank" class="discord">
      Discord
    </a>
  </div>
</div>

<script>
/* Disable right click */
document.addEventListener('contextmenu', event => event.preventDefault());

/* Disable drag */
document.addEventListener('dragstart', event => event.preventDefault());

/* Disable certain key shortcuts */
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && ['u','s','c','x','v'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if (e.key === "F12") {
    e.preventDefault();
  }
});
</script>

</body>
</html>
